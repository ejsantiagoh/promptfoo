# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Getting started with Gemini

prompts:
  - "Convert this English to {{language}}: {{input}}"
  - "Translate to {{language}}: {{input}}"

providers:
  - id: google:gemini-2.5-flash
    # Opcional: config para ajustar temperatura, etc.
    # config:
    #   temperature: 0.7
  - id: google:gemini-2.5-flash-lite  # <-- Este es el nombre correcto (con guión)
  # - id: google:gemini-2.5-pro  # Descomenta si quieres probar el más potente

tests:
  - vars:
      language: French
      input: Hello world
    assert:
      - type: contains
        value: "Bonjour"
  - vars:
      language: Spanish
      input: Where is the library?
    assert:
      - type: icontains
        value: "biblioteca"